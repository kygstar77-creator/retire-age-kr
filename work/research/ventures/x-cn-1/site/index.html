<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험 일정</title>
<meta name="description" content="공식 원문과 매일 대조하는 시험 일정 모음.">
<meta name="robots" content="noindex"><link rel="canonical" href="https://kygstar77-creator.github.io/exam-dates-kr/">
<meta property="og:type" content="article">
<meta property="og:title" content="시험 일정">
<meta property="og:description" content="공식 원문과 매일 대조하는 시험 일정 모음.">
<meta property="og:url" content="https://kygstar77-creator.github.io/exam-dates-kr/">
<meta name="theme-color" content="#f5f6f8">
<style>:root{--bg:#f5f6f8;--card:#fff;--ink:#17191d;--sub:#5f646d;--line:#e2e4e8;--accent:#24508f;--accent-ink:#fff;--dark:#16202e;--dark-ink:#f1f4f8;--dark-sub:#b4c0d0;
 --fs1:26px;--fs2:20px;--fs3:17px;--fs4:15px;--fs5:13px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--ink:#eef1f5;--sub:#9aa1ac;--line:#2b2f37;--accent:#7fa6e0;--accent-ink:#0c1420;--dark:#1e2a3b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs3)/1.55 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{height:52px;display:flex;align-items:center}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:var(--fs4);display:inline-block;padding:12px 4px 12px 0;min-height:44px}
h1{font-size:var(--fs1);line-height:1.3;margin:8px 0 16px;letter-spacing:-.01em}
h2{font-size:var(--fs2);margin:36px 0 12px}
h3{font-size:var(--fs3);margin:0 0 12px}
a{color:var(--accent)}
.next{background:var(--dark);color:var(--dark-ink);border-radius:20px;padding:20px;margin:0 0 8px}
.line{font-size:var(--fs3);line-height:1.6;margin:0 0 8px}
.line .stamp{color:var(--dark-sub)}
.line strong{color:#fff;font-weight:700}
.line .after{color:var(--dark-ink)}
.line a.official{color:#fff;font-weight:700}
.sub{font-size:var(--fs4);color:var(--dark-sub);margin:0 0 16px}
.sub:empty{display:none}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:12px;font:700 var(--fs4) inherit;font-family:inherit;text-decoration:none;cursor:pointer;padding:0 12px}
.primary{background:#fff;color:var(--dark)}
.ghost{background:rgba(255,255,255,.12);color:var(--dark-ink)}
.src{font-size:var(--fs5);color:var(--sub);margin:8px 0 0}
.src a{color:var(--sub);display:inline-block;padding:10px 0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs4);background:var(--card);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:var(--fs5);color:var(--sub);font-weight:600}
tr.past{color:var(--sub)}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:var(--fs4)}
dt{color:var(--sub)}
dd{margin:0;font-variant-numeric:tabular-nums}
.notes{padding-left:20px;font-size:var(--fs4)}
.notes li{margin:0 0 6px}
.list a{display:inline-block;padding:12px 0}
footer{font-size:var(--fs5);color:var(--sub);margin-top:40px}
footer a{color:var(--sub);display:inline-block;padding:12px 0}
@media (max-width:360px){th,td{padding:8px 4px;font-size:var(--fs5)}dl{grid-template-columns:1fr;gap:0}dd{margin:0 0 8px}}
</style>
</head>
<body>
<div class="wrap">
<header><a href="https://kygstar77-creator.github.io/exam-dates-kr/">시험 일정</a></header>
<main>

</main>

</footer>
</div>
</body>
</html>
