<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fm-ds.css"><style>body{margin:0;padding:16px;background:#f2f4f6}</style></head><body>
<div id="root"></div>
<script>
const V=[['A 현재·하한','상한 · 하한','하한 66,048원'],['B 현재·상한','상한 · 하한','상한 68,100원'],['C 현재·60%','상한 · 하한','평균임금의 60%'],['D 제안·하한','하한','66,048원'],['E 제안·상한','상한','68,100원'],['F 제안·60%','상한 · 하한','평균임금의 60%']];
document.getElementById('root').innerHTML=V.map(([id,l,v])=>`<section id="${id[0]}" class="ds-card ds-card--hero ds-hero ds-hero--compact-tiles" style="margin-bottom:16px"><div class="ds-stat ds-stat--md"><span class="ds-stat__label">${id}</span><span class="ds-stat__value">11,888,640원</span></div><div class="ds-tiles ds-hero__tiles">${[['1일 구직급여액','66,048원'],['소정급여일수','180일'],[l,v]].map(([a,b])=>`<div class="ds-tile"><div class="ds-stat ds-stat--sm ds-stat--center"><span class="ds-stat__label">${a}</span><span class="ds-stat__value">${b}</span></div></div>`).join('')}</div></section>`).join('');
</script></body></html>
