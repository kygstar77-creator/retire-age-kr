name: Build visual audit artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install visual audit tools
        run: npm install --no-save playwright http-server

      - name: Build static site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          npx http-server outputs/deploy -p 4173 > /tmp/retire-age-preview.log 2>&1 &
          sleep 3
          node work/audit-capture.mjs

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: audit-output
