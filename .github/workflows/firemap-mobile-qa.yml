name: FireMap Mobile QA

on:
  push:
    branches:
      - firemap-v2-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run mobile QA
        run: npm run qa:mobile

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firemap-mobile-screenshots
          path: |
            test-results/firemap-screenshots
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
