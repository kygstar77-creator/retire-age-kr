<title>해성시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to the four corners like a dashcam overlay. Single dark look by choice. */
:root{
  --night:#0a0f16;
  --glass:rgba(9,15,23,.7);
  --edge:rgba(214,230,245,.16);
  --text:#eef3f8;
  --mute:#9aabbc;
  --sodium:#ffb547;
  --cash:#8be6a0;
  --signal:#62d6e8;
  --alert:#ff6b5b;
  --display:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--text);font-family:var(--body);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;pointer-events:none;z-index:5}
.panel{background:var(--glass);border:1px solid var(--edge);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#topleft{top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;padding:10px 14px}
#cash{font-family:var(--display);font-size:28px;line-height:1;color:var(--cash);letter-spacing:.01em;font-variant-numeric:tabular-nums}
#cash.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.12)}}
.subline{display:flex;gap:12px;font-family:var(--mono);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.subline b{color:var(--text);font-weight:700}

#mapwrap{top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:180px;height:180px;border-radius:50%;border:2px solid var(--edge);box-shadow:0 6px 24px rgba(0,0,0,.45);overflow:hidden;background:#13202b}
#mapwrap.big{width:300px;height:300px}
#mini{width:100%;height:100%;display:block}

#mission{top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:10px 18px 12px;text-align:center;min-width:240px;max-width:min(440px,calc(100vw - 420px))}
#mtitle{font-family:var(--display);font-size:20px;color:var(--sodium);letter-spacing:.02em}
#mdesc{font-size:13px;color:var(--mute);margin-top:2px}
#mtime{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
#mtime.low{color:var(--alert)}

#speedo{bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(18px + env(safe-area-inset-right,0px));padding:10px 16px;text-align:right;min-width:120px}
#kmh{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:11px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-top:4px}
#gear{color:var(--sodium)}

#prompt{bottom:calc(120px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
kbd{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin-right:4px;color:var(--text)}

#toasts{top:calc(130px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{padding:8px 16px;font-size:15px;font-weight:500;animation:toast 3.2s ease forwards;white-space:nowrap}
.toast.good{color:var(--cash)} .toast.bad{color:var(--alert)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

#keyhint{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));font-size:12px;color:var(--mute);padding:6px 10px}

#flash{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,60,40,.35));opacity:0;transition:opacity .4s}

/* overlay: start + pause */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:flex-start;background:linear-gradient(90deg,rgba(6,10,16,.92) 0%,rgba(6,10,16,.7) 42%,rgba(6,10,16,0) 75%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(24px,env(safe-area-inset-bottom,0px))}
.card{max-width:520px;display:flex;flex-direction:column;gap:18px;padding:clamp(12px,4vw,48px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--sodium);text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,11vw,104px);line-height:.92;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{display:block;font-size:.34em;letter-spacing:.32em;color:var(--mute);margin-top:10px;font-family:var(--mono);font-weight:500}
.lede{font-size:15.5px;line-height:1.65;color:#c9d5e1;margin:0;max-width:44ch}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:13px;color:#c9d5e1}
.controls div{display:flex;align-items:center;gap:6px;min-width:0}
.go{pointer-events:auto;align-self:flex-start;font-family:var(--display);font-size:22px;color:#111;background:var(--sodium);border:0;border-radius:8px;padding:14px 28px;cursor:pointer;letter-spacing:.03em;box-shadow:0 8px 30px rgba(255,181,71,.3);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.saveline{font-family:var(--mono);font-size:12px;color:var(--mute)}

/* touch */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#joy{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35)}
#tbtns{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
#tbtns button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(9,15,23,.6);color:var(--text);font-family:var(--body);font-size:13px;font-weight:700;touch-action:none}
#tbtns button:active{background:rgba(255,181,71,.5)}
body.touch #keyhint{display:none}
body.touch #speedo{bottom:auto;top:calc(210px + env(safe-area-inset-top,0px));min-width:0;padding:6px 12px}
body.touch #speedo #kmh{font-size:28px}
body.touch #mapwrap{width:130px;height:130px}
body.touch #mission{max-width:calc(100vw - 180px);left:calc(14px + env(safe-area-inset-left,0px));transform:none;top:calc(96px + env(safe-area-inset-top,0px));text-align:left;min-width:0}
@media (max-width:560px){
  .controls{grid-template-columns:minmax(0,1fr)}
  #overlay{background:linear-gradient(0deg,rgba(6,10,16,.95) 0%,rgba(6,10,16,.75) 60%,rgba(6,10,16,.2) 100%)}
}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:3.2s}#cash.bump{animation:none}.go{transition:none}}
</style>

<canvas id="game" tabindex="0" aria-label="해성시티 3D 화면"></canvas>
<div id="flash"></div>

<div class="hud panel" id="topleft">
  <div id="cash">₩0</div>
  <div class="subline"><span><b id="clock">16:30</b></span><span>별 <b id="stars">0/12</b></span></div>
</div>
<div class="hud" id="mapwrap"><canvas id="mini" width="360" height="360"></canvas></div>
<div class="hud panel" id="mission" hidden><div id="mtitle"></div><div id="mdesc"></div><div id="mtime"></div></div>
<div class="hud panel" id="speedo" hidden><div id="kmh">0</div><div class="unit"><span id="gear">D</span> · km/h</div></div>
<div class="hud panel" id="prompt" hidden></div>
<div class="hud" id="toasts"></div>
<div class="hud panel" id="keyhint"><kbd>P</kbd>도움말 · <kbd>M</kbd>지도 · <kbd>V</kbd>시점 · <kbd>T</kbd>시간</div>

<div id="touch" hidden>
  <div id="joy"><div id="knob"></div></div>
  <div id="tbtns">
    <button type="button" id="tb-f" data-k="KeyF">탑승</button>
    <button type="button" id="tb-j" data-k="Space">점프</button>
    <button type="button" id="tb-v" data-k="KeyV">시점</button>
    <button type="button" id="tb-h" data-k="KeyH">경적</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div class="eyebrow" id="ov-eyebrow">오픈월드 · 해안 도시 · 64블록</div>
    <h1 id="ov-title">해성시티<span>HAESEONG CITY</span></h1>
    <p class="lede" id="ov-lede">남쪽은 바다, 북쪽은 산. 신호등이 바뀌고 사람들이 걸어 다니는 도시를 마음대로 걷고, 아무 차나 타고, 배달과 레이스로 돈을 버세요. 해가 지면 창문과 가로등이 켜집니다.</p>
    <div class="controls" id="ov-controls">
      <div><kbd>W A S D</kbd>걷기 · 운전</div>
      <div><kbd>마우스</kbd>시점 (클릭 후)</div>
      <div><kbd>Shift</kbd>달리기</div>
      <div><kbd>Space</kbd>점프 · 핸드브레이크</div>
      <div><kbd>F</kbd>차 타기 · 내리기</div>
      <div><kbd>V</kbd>1인칭 · 3인칭</div>
      <div><kbd>H</kbd>경적</div>
      <div><kbd>Q</kbd>미션 포기</div>
      <div><kbd>T</kbd>시간 +3시간</div>
      <div><kbd>U</kbd>소리 켜기 · 끄기</div>
    </div>
    <button class="go" id="go" type="button">도시로 들어가기</button>
    <div class="saveline" id="saveline"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

// ================= world constants =================
const N = 8, ROAD = 14, BLOCK = 60, CELL = BLOCK + ROAD, HALF = N * CELL / 2, HR = ROAD / 2;
const SEA_Z = HALF + 48;
const roadPos = i => i * CELL - HALF;
let seed = 20261119;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const MR = (a, b) => a + (b - a) * Math.random();
const mpick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerpAngle = (a, b, t) => { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * t; };
const col = h => new THREE.Color(h).convertSRGBToLinear();
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ================= renderer =================
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.25 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9d4ea, 90, 520);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.15, 2200);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const ANISO = renderer.capabilities.getMaxAnisotropy();

// ================= textures =================
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO; t.repeat.set(rx, ry);
  return t;
}
function noise(g, w, h, n, colors, size = 2) { for (let i = 0; i < n; i++) { g.fillStyle = colors[Math.floor(rand() * colors.length)]; g.fillRect(rand() * w, rand() * h, size, size); } }
const texAsphalt = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#3a3f45'; g.fillRect(0, 0, w, h); noise(g, w, h, 5000, ['#2f3338', '#454a51', '#363a40', '#4d525a'], 2); }, 110, 110);
const texSidewalk = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#aca99f'; g.fillRect(0, 0, w, h); noise(g, w, h, 900, ['#a19e95', '#b5b2a9', '#9b988f'], 2);
  g.strokeStyle = '#8c8981'; g.lineWidth = 2; for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); }
}, 15, 15);
const grassDraw = (g, w, h) => { g.fillStyle = '#4b7638'; g.fillRect(0, 0, w, h); noise(g, w, h, 6000, ['#43692f', '#55823f', '#3e6430', '#5d8a45'], 3); };
const texGrass = canvasTex(256, 256, grassDraw, 400, 400);
const texPark = canvasTex(256, 256, grassDraw, 8, 8);
const texSand = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#d7c497'; g.fillRect(0, 0, w, h); noise(g, w, h, 5000, ['#cdb987', '#e0cfa6', '#c6b07c'], 2); }, 200, 12);
const texSea = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#1b5272'; g.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { g.fillStyle = rand() < .5 ? 'rgba(120,190,220,.25)' : 'rgba(10,40,60,.3)'; g.fillRect(rand() * w, rand() * h, R(6, 26), 2); } }, 120, 60);

// facade: 8x8 windows over 32x32 world units
function facade(st) {
  const S = 256, n = 8, cell = S / n;
  const map = canvasTex(S, S, g => {
    g.fillStyle = st.wall; g.fillRect(0, 0, S, S); noise(g, S, S, 500, ['rgba(0,0,0,.07)', 'rgba(255,255,255,.05)'], 2);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const x = c * cell + st.mx, y = r * cell + st.my, w = cell - st.mx * 2, h = cell - st.my * 2;
      const grd = g.createLinearGradient(x, y, x + w, y + h); grd.addColorStop(0, st.g1); grd.addColorStop(1, st.g2);
      g.fillStyle = grd; g.fillRect(x, y, w, h);
      g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(x, y, w, 2);
      if (st.sill) { g.fillStyle = st.sill; g.fillRect(x - 1, y + h, w + 2, 2); }
    }
  });
  const emi = canvasTex(S, S, g => {
    g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    const lights = ['#ffd08a', '#ffe2b5', '#fff1d6', '#cfe0ff', '#ffc77a'];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (rand() > st.lit) continue;
      const x = c * cell + st.mx, y = r * cell + st.my, w = cell - st.mx * 2, h = cell - st.my * 2;
      g.globalAlpha = R(.45, 1); g.fillStyle = pick(lights); g.fillRect(x + 1, y + 1, w - 2, h - 2);
    }
    g.globalAlpha = 1;
  });
  return new THREE.MeshStandardMaterial({ map, emissiveMap: emi, emissive: new THREE.Color(1, .92, .8), emissiveIntensity: 0, roughness: st.rough, metalness: st.metal });
}
const F = {
  glass: facade({ wall: '#2a3a4b', g1: '#6f93b8', g2: '#1c2b3d', mx: 2, my: 3, lit: .42, rough: .22, metal: .55 }),
  teal: facade({ wall: '#1e3a3d', g1: '#5e9c97', g2: '#14302f', mx: 1, my: 4, lit: .38, rough: .25, metal: .5 }),
  white: facade({ wall: '#dedbd3', g1: '#7d97ad', g2: '#2b3846', mx: 5, my: 9, lit: .4, rough: .7, metal: .05, sill: '#bab6ad' }),
  concrete: facade({ wall: '#b3ada2', g1: '#475868', g2: '#1b232c', mx: 8, my: 9, lit: .33, rough: .9, metal: 0, sill: '#97918a' }),
  warm: facade({ wall: '#c7b49a', g1: '#4d5d6c', g2: '#1d252d', mx: 7, my: 8, lit: .36, rough: .9, metal: 0, sill: '#a8957c' }),
  brick: facade({ wall: '#8d4c3b', g1: '#3a4752', g2: '#151b21', mx: 9, my: 8, lit: .35, rough: .95, metal: 0, sill: '#c9bfb2' }),
};
const FACADES = Object.values(F);
const TALL = [F.glass, F.teal, F.white, F.glass];
const LOW = [F.concrete, F.warm, F.brick, F.white, F.concrete];

// ================= materials =================
const M = {
  asphalt: new THREE.MeshStandardMaterial({ map: texAsphalt, roughness: .95 }),
  sidewalk: new THREE.MeshStandardMaterial({ map: texSidewalk, roughness: .9 }),
  grass: new THREE.MeshStandardMaterial({ map: texGrass, roughness: 1 }),
  park: new THREE.MeshStandardMaterial({ map: texPark, roughness: 1 }),
  sand: new THREE.MeshStandardMaterial({ map: texSand, roughness: 1 }),
  sea: new THREE.MeshStandardMaterial({ map: texSea, roughness: .12, metalness: .35, color: col('#cfe3ee') }),
  roof: new THREE.MeshStandardMaterial({ color: col('#4a4d52'), roughness: .9 }),
  roof2: new THREE.MeshStandardMaterial({ color: col('#6c6f73'), roughness: .85 }),
  metal: new THREE.MeshStandardMaterial({ color: col('#3b3f44'), roughness: .5, metalness: .6 }),
  lampHead: new THREE.MeshStandardMaterial({ color: col('#2b2e33'), emissive: col('#ffcf8a'), emissiveIntensity: 0 }),
  beacon: new THREE.MeshStandardMaterial({ color: col('#550000'), emissive: col('#ff2a1a'), emissiveIntensity: 0 }),
  white: new THREE.MeshBasicMaterial({ color: col('#e8e6df') }),
  yellow: new THREE.MeshBasicMaterial({ color: col('#e9b632') }),
  trunk: new THREE.MeshStandardMaterial({ color: col('#5b4331'), roughness: 1 }),
  leaf: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .9, flatShading: true }),
  mountain: new THREE.MeshStandardMaterial({ color: col('#4a5f4b'), roughness: 1, flatShading: true }),
  glassCar: new THREE.MeshStandardMaterial({ color: col('#1a2530'), roughness: .08, metalness: .8 }),
  tire: new THREE.MeshStandardMaterial({ color: col('#151515'), roughness: .9 }),
  rim: new THREE.MeshStandardMaterial({ color: col('#b9bec4'), roughness: .3, metalness: .9 }),
  headlight: new THREE.MeshStandardMaterial({ color: col('#e8e8e0'), emissive: col('#fff3d6'), emissiveIntensity: .2 }),
  sigHouse: new THREE.MeshStandardMaterial({ color: col('#24272b'), roughness: .6 }),
  sigLamp: new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }),
  star: new THREE.MeshStandardMaterial({ color: col('#ffcf3a'), emissive: col('#ffb300'), emissiveIntensity: 1.2, metalness: .6, roughness: .25 }),
};

// ================= lights + sky =================
const hemi = new THREE.HemisphereLight(0xd6e6ff, 0x4b4434, .6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 1.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 95, bottom: -95, near: 1, far: 450 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const sunDir = new THREE.Vector3(.5, .7, .3).normalize();

const skyU = { top: { value: new THREE.Color('#3f7fd0') }, bottom: { value: new THREE.Color('#b9d4ea') }, sunDir: { value: sunDir }, sunCol: { value: new THREE.Color('#fff3d0') }, sunVis: { value: 1 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; uniform vec3 sunCol; uniform float sunVis; varying vec3 vDir;

    if (mx * mx + mz * mz > 1e-6) n.facing = lerpAngle(n.facing, Math.atan2(mx, mz), Math.min(1, dt * 8));
    n.pos.set(x, .2, z); n.phase += spd * dt * 3.2; animPerson(n.p, n.phase, spd > 0 ? .55 : 0);
  } else if (n.state === 'down') {
    n.vel.y -= 20 * dt; n.pos.addScaledVector(n.vel, dt);
    const gh = groundH(n.pos.x, n.pos.z); if (n.pos.y < gh) { n.pos.y = gh; n.vel.y = 0; const f = Math.pow(.03, dt); n.vel.x *= f; n.vel.z *= f; }
    pushOut(n.pos, .4); n.fall = Math.min(1, n.fall + dt * 4); animPerson(n.p, 0, 0);
    n.timer -= dt; if (n.timer <= 0) { n.state = 'return'; n.b = nearestBlock(n.pos.x, n.pos.z); n.r = rectOf(n.b); n.s = nearestS(n.r, n.pos.x, n.pos.z); }
  } else {
    if (n.fall > 0) n.fall = Math.max(0, n.fall - dt * 2);
    else {
      const [x, z] = perimPoint(n.r, n.s), mx = x - n.pos.x, mz = z - n.pos.z, d = Math.hypot(mx, mz);
      if (d < .3) n.state = 'walk';
      else { const sp = 1.7; n.pos.x += mx / d * sp * dt; n.pos.z += mz / d * sp * dt; n.facing = lerpAngle(n.facing, Math.atan2(mx, mz), Math.min(1, dt * 8)); n.phase += sp * dt * 3.2; animPerson(n.p, n.phase, .55); }
      n.pos.y += (groundH(n.pos.x, n.pos.z) - n.pos.y) * Math.min(1, dt * 10);
    }
  }
  n.p.g.position.set(n.pos.x, n.pos.y + n.fall * .17, n.pos.z); n.p.g.rotation.y = n.facing; n.p.g.rotation.x = -n.fall * Math.PI / 2;
}

// ================= camera =================
const camPos = new THREE.Vector3(0, 80, 160), camTarget = new THREE.Vector3(), lookDir = new THREE.Vector3();
let orbitT = 0;
function updateCamera(dt, now) {
  if (!started) {
    orbitT += dt * .05; const r = 150;
    camera.position.set(Math.sin(orbitT) * r, 62, Math.cos(orbitT) * r + 40); camera.lookAt(0, 18, 20); camera.fov = 60; camera.updateProjectionMatrix(); return;
  }
  const c = player.car; let dist;
  if (c) {
    camTarget.set(c.pos.x, c.pos.y + 1.7, c.pos.z);
    const sp = Math.abs(c.fwdSpeed); dist = 8.8 + Math.min(sp / c.stats.max, 1) * 2.2;
    if (now - lastLook > 1400 && (sp > 2 || cam.fp)) { cam.yaw = lerpAngle(cam.yaw, c.heading, Math.min(1, dt * (cam.fp ? 6 : 2.6))); cam.pitch = lerp(cam.pitch, cam.fp ? -.05 : -.2, Math.min(1, dt * 2)); }
  } else { camTarget.set(player.pos.x, player.pos.y + 1.6, player.pos.z); dist = 5.2; }
  lookDir.set(Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), Math.cos(cam.yaw) * Math.cos(cam.pitch));
  if (cam.fp) {
    if (c) { const s = Math.sin(c.heading), co = Math.cos(c.heading); camera.position.set(c.pos.x + co * .38 + s * .1, c.pos.y + (c.type === 'van' ? 1.9 : c.type === 'sport' ? 1.08 : 1.28), c.pos.z - s * .38 + co * .1); }
    else camera.position.set(player.pos.x + lookDir.x * .25, player.pos.y + 1.68, player.pos.z + lookDir.z * .25);
    camera.lookAt(camera.position.x + lookDir.x, camera.position.y + lookDir.y, camera.position.z + lookDir.z);
  } else {
    let t = dist;
    for (let s = .6; s <= dist; s += .35) { const x = camTarget.x - lookDir.x * s, y = camTarget.y - lookDir.y * s, z = camTarget.z - lookDir.z * s; if (pointSolid(x, y, z)) { t = Math.max(.8, s - .45); break; } }
    const want = new THREE.Vector3(camTarget.x - lookDir.x * t, camTarget.y - lookDir.y * t, camTarget.z - lookDir.z * t);
    want.y = Math.max(want.y, groundH(want.x, want.z) + .35);
    camPos.lerp(want, 1 - Math.exp(-dt * (c ? 14 : 22)));
    if (camPos.distanceTo(want) > 30) camPos.copy(want);
    camera.position.copy(camPos);
    if (shake > 0) { camera.position.x += (Math.random() - .5) * shake * .6; camera.position.y += (Math.random() - .5) * shake * .6; shake = Math.max(0, shake - dt * 2.5); }
    camera.lookAt(camTarget);
  }
  const fov = 65 + (c ? Math.min(Math.abs(c.fwdSpeed) / 40, 1) * 12 : 0);
  if (Math.abs(camera.fov - fov) > .05) { camera.fov = lerp(camera.fov, fov, Math.min(1, dt * 3)); camera.updateProjectionMatrix(); }
}

// ================= main loop =================
let last = performance.now(), hudT = 0;
function update(dt, now) {
  sigTime += dt; updateSignals(sigTime); updateSky(dt);
  if (started && !paused) {
    if (kp('KeyF')) { if (player.car) exitCar(); else { const v = nearestEnterable(); if (v) enterCar(v); } }
    if (kp('KeyV')) { cam.fp = !cam.fp; player.model.g.visible = !cam.fp && !player.car; }
    if (kp('KeyM')) { mapBig = !mapBig; $('mapwrap').classList.toggle('big', mapBig); }
    if (kp('KeyT')) { hour = (hour + 3) % 24; toast(`시간을 3시간 앞당겼습니다`); }
    if (kp('KeyH')) tone([392, 494], .35, 'square', .05);
    if (kp('KeyU')) { audio.on = !audio.on; toast(audio.on ? '소리 켜짐' : '소리 꺼짐'); }
    if (kp('KeyQ') && mission) endMission(false, '미션을 포기했습니다');
    if (player.car) updatePlayerCar(dt); else updateFoot(dt);
  }
  focus.copy(player.car ? player.car.pos : player.pos);
  if (!started) focus.set(0, 0, 0);
  for (let i = vehicles.length - 1; i >= 0; i--) {
    const v = vehicles[i];
    if (v === player.car) { syncCar(v, dt); continue; }
    if (v.ai) updateAI(v, dt);
    else if (v.vel.lengthSq() > .02) { drive(v, dt, 0, 0, true); if (v.vel.lengthSq() < .02) v.vel.set(0, 0, 0); collideStatic(v); for (const o of vehicles) if (o !== v && !o.ai && o !== player.car) collideCars(v, o); }
    else { v.fwdSpeed = 0; v.braking = false; }
    const far = (v.pos.x - focus.x) ** 2 + (v.pos.z - focus.z) ** 2;
    v.group.visible = far < 300 * 300;
    if (!v.ai && v !== parkedCar && far > 260 * 260 && vehicles.filter(o => !o.ai).length > 22) { removeVehicle(v); continue; }
    syncCar(v, dt);
  }
  for (const n of npcs) updateNPC(n, dt);
  if (npcs.length > 70) { const i = npcs.findIndex(n => (n.pos.x - focus.x) ** 2 + (n.pos.z - focus.z) ** 2 > 200 * 200); if (i >= 0) { scene.remove(npcs[i].p.g); npcs.splice(i, 1); } }
  if (started) {
    starsC.forEach((m, i) => {
      if (!m.visible) return; m.rotation.y += dt * 2; m.position.y = 1.4 + groundH(m.position.x, m.position.z) + Math.sin(now / 400 + i) * .25;
      if (Math.hypot(m.position.x - focus.x, m.position.z - focus.z) < (player.car ? 3 : 1.6)) {
        m.visible = false; save.stars.push(i); setMoney(50000); $('stars').textContent = `${save.stars.length}/${STAR_TOTAL}`;
        toast(`숨은 별 발견 (${save.stars.length}/${STAR_TOTAL})  +₩50,000`, 'good'); tone([784, 988, 1175, 1568], .3, 'triangle', .07, .07);
        if (save.stars.length === STAR_TOTAL) toast('해성시티의 별을 모두 찾았습니다', 'good');
      }
    });
    updateMissions(dt);
  }
  // lights near focus
  sun.position.copy(focus).addScaledVector(elevDir(), 220); sun.target.position.copy(focus);
  updateLampPool(dt);
  if (player.car && night > .05) {
    const v = player.car, s = Math.sin(v.heading), c = Math.cos(v.heading);
    headSpot.intensity = night * 3; headSpot.position.set(v.pos.x + s * 2.4, 1, v.pos.z + c * 2.4); headSpot.target.position.set(v.pos.x + s * 20, 0, v.pos.z + c * 20);
  } else headSpot.intensity = 0;
  pressed.clear();
}
const _ed = new THREE.Vector3();
function elevDir() { _ed.copy(sunDir); if (_ed.y < 0) _ed.negate(); if (_ed.y < .15) { _ed.y = .15; _ed.normalize(); } return _ed; }
function updateHUD(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = .1;
  const h = Math.floor(hour), m = Math.floor((hour - h) * 60); $('clock').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  const c = player.car; $('speedo').hidden = !c || !started;
  if (c) { $('kmh').textContent = Math.round(Math.abs(c.fwdSpeed) * 3.6); $('gear').textContent = c.fwdSpeed < -.5 ? 'R' : 'D'; }
  let p = '';
  if (started && !paused) {
    if (c) p = Math.abs(c.fwdSpeed) < 4 ? `<kbd>F</kbd>내리기` : '';
    else if (nearestEnterable()) p = `<kbd>F</kbd>${nearestEnterable().ai ? '차 세우고 타기' : '차 타기'}`;
  }
  if (isTouch) p = p.replace(/<kbd>F<\/kbd>/, '탑승 버튼: ');
  $('prompt').hidden = !p; if (p && $('prompt').innerHTML !== p) $('prompt').innerHTML = p;
  $('tb-f').textContent = c ? '내리기' : '탑승';
  $('tb-j').textContent = c ? '브레이크' : '점프';
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, .05); last = now;
  if (paused) dt = 0;
  update(dt, now); updateCamera(dt, now); sky.position.copy(camera.position); starField.position.copy(camera.position);
  updateHUD(dt); if (started) drawMini(); updateAudio();
  renderer.render(scene, camera);
}

// ================= overlay =================
$('cash').textContent = won(save.money); $('stars').textContent = `${save.stars.length}/${STAR_TOTAL}`;
if (save.money || save.stars.length) $('saveline').textContent = `이어하기 · 모은 돈 ${won(save.money)} · 별 ${save.stars.length}/${STAR_TOTAL}`;
if (isTouch) { document.body.classList.add('touch'); $('ov-controls').innerHTML = '<div>왼쪽 스틱으로 걷기·운전, 끝까지 밀면 달리기</div><div>오른쪽 화면을 끌어 시점 돌리기</div><div>탑승 · 점프(브레이크) · 시점 · 경적 버튼</div>'; }
for (const id of ['topleft', 'mapwrap', 'keyhint']) $(id).hidden = true;
function begin() {
  initAudio(); if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  $('overlay').hidden = true; paused = false;
  for (const id of ['topleft', 'mapwrap', 'keyhint']) $(id).hidden = false;
  if (isTouch) $('touch').hidden = false;
  if (!started) { started = true; cam.yaw = Math.PI; camPos.set(player.pos.x, player.pos.y + 3, player.pos.z + 5); toast('주황색 기둥 = 배달, 파란 기둥 = 레이스'); setTimeout(() => toast('빨간 스포츠카가 바로 옆에 있습니다 · F'), 1600); }
  else if (mission) $('mission').hidden = false;
  if (!isTouch) { try { const p = canvas.requestPointerLock && canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
  canvas.focus();
}
function pause() {
  if (!started) return; paused = true;
  $('ov-eyebrow').textContent = '일시정지'; $('ov-title').innerHTML = '해성시티<span>PAUSED</span>';
  $('ov-lede').textContent = `지금 ${$('clock').textContent} · 모은 돈 ${won(save.money)} · 별 ${save.stars.length}/${STAR_TOTAL}`;
  $('go').textContent = '계속하기'; $('saveline').textContent = '진행 상황은 이 브라우저에 자동 저장됩니다';
  $('overlay').hidden = false; if (document.pointerLockElement) document.exitPointerLock();
}
$('go').addEventListener('click', begin);
addEventListener('keydown', e => { if (e.code === 'KeyP' || (e.code === 'Escape' && !locked && started && !paused)) { paused ? begin() : pause(); } else if ((e.code === 'Enter') && $('overlay').hidden === false) begin(); });
requestAnimationFrame(frame);
})();
</script>
