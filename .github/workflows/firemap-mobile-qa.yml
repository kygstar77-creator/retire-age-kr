name: FireMap Mobile QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install webkit --with-deps
      - run: npm run build
      - name: Run mobile QA on current branch build
        run: npm run qa:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firemap-mobile-screenshots
          path: |
            test-results/firemap-screenshots
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
