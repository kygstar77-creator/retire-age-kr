<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연봉 실수령 v4</title>
<!-- v4 r2: Claude 심사 2명 공통 지적 반영 — 행 부품 하나(이름 회색 보통·값 검정 굵게, 공제는 −부호), 버튼 안 꺾쇠 뺌·순서 결과→조건→공제→버튼, 다크 숫자 카드 테두리 뺌(명도로만), 출처 단어 단위 줄바꿈, 데스크톱 두 열 끝 맞춤.
     v4 r1 (firemap-designer 2026-10-05 08:1x): v3 r5에서 바꾼 것 — 심사에서 가장 많이 깎인 점부터.
     ① 제미나이 3판 연속 '2010년대 웹 폼(테두리 입력칸)·설문조사 느낌' → 결과 화면에서는 입력칸을 없애고 '조건' 행 3개(56px 행 1종, 값+chevron, 누르면 편집)로 접음.
        채움형↔테두리형 왕복을 끊는 제3안(토스 결과 화면식 요약 행). 연봉/월급 토글은 편집 시트 안으로 → 탭 '연봉'·칸 '연봉' 중복도 사라짐.
     ② 고정 바 위로 다음 카드 모서리 비침 → 고정 해제. 행 접기로 375×812 첫 화면 안에 결과→조건→버튼이 다 들어감(숫자1+행동1 유지).
     ③ 다크 카드와 주황이 시선을 나눔 → 버튼을 다크 카드 바로 밑이 아니라 조건 카드 뒤에 둬 거리 둠, 결과 숫자 40→44, 보조 글 .64로 낮춤.
     토큰은 v3와 같음(새 색·새 수치 없음). 값도 v3와 같음.
     ---- 아래는 v3 주석 ----
     v3 (firemap-designer 2026-10-05): '레퍼런스 토큰 안에서' 다시 만든 연봉 결과 시안.
     수치 출처 = tokens-ref/compare.md 표 (Dembrandt v0.37.0 + computed.py 375px 글자 가중).
     토스: 글자색 #191F28/#4E5968/#6B7684/#8B95A1, 바탕 #F2F4F6 + 흰 카드 r16, 굵기 400/600/700, 본문 17/1.6
     KRDS: 줄간격 1.5, 안쪽 여백 24·16·8, 버튼 높이 큰 것 64 → 우리는 56(뱅크샐러드 50과 사이)
     뱅크샐러드: tnum 숫자, Pretendard
     우리 것으로 남긴 것(규칙): 주황 #ff5a00 = 행동 1곳(색 4 규칙), 숫자 1 + 행동 1.
     v2f 레드팀 3개 반영: ① 숫자가 1등(주황은 화면 아래 고정 버튼으로, 숫자 카드 안에 주황 없음) ② 아래 줄 아코디언 1종 56px+chevron ③ 데스크톱 두 열 높이 맞춤 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 색 — 토스 글자 4단(실측) + 우리 주황 1 */
  --ink:#191f28; --ink-2:#4e5968; --ink-3:#6b7684; --ink-4:#8b95a1;
  --page:#f2f4f6; --card:#ffffff; --field:#f2f4f6; --field-line:#d1d6db; --line:rgba(0,27,55,.08);
  --accent:#ff5a00; --accent-press:#e64f00;
  /* 글자 — 토스 17/15/13 + 결과 40 + 제목 22 */
  --fs-hero:40px; --fs-title:22px; --fs-body:17px; --fs-label:15px; --fs-caption:13px;
  /* 여백 — KRDS 24·16·8 / 토스 4·8 */
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
  /* 모서리 — 토스 16·10, KRDS 12 */
  --r-card:16px; --r-field:12px; --r-btn:16px; --r-small:10px;
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#f2f4f6; --ink-2:#c3c9d1; --ink-3:#9aa3ae; --ink-4:#7d8691;
  --page:#0b0c0e; --card:#17191d; --field:#22252b; --field-line:#3a3e46; --line:rgba(255,255,255,.08); --seg-on:#3a3e47;}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .res{background:#2b3341}}
:root[data-theme=dark]{--ink:#f2f4f6; --ink-2:#c3c9d1; --ink-3:#9aa3ae; --ink-4:#7d8691;
  --page:#101114; --card:#1b1d22; --field:#26292f; --line:rgba(255,255,255,.08);}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.5;letter-spacing:0;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.top{height:56px;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);max-width:1080px;margin:0 auto}
.top b{font-size:var(--fs-label);font-weight:700}
.menu{margin-left:auto;display:none;gap:var(--s4)}
.menu a{font-size:var(--fs-label);color:var(--ink-3);font-weight:600}
.menu a[aria-current]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);padding-bottom:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--s3)}
h1{font-size:var(--fs-title);font-weight:700;line-height:1.36;padding:var(--s2) var(--s2) var(--s3)}
.card{background:var(--card);border-radius:var(--r-card);padding:var(--s4)}
.grid{display:flex;flex-direction:column;gap:var(--s3)}
.col-l,.col-r{display:contents}
.res{order:-1}
/* 결과: 숫자 1 */
.res{background:#191f28;color:#fff}
.inp{padding-bottom:var(--s2)}
.res .q{font-size:var(--fs-label);color:rgba(255,255,255,.64);font-weight:600}
.res .n{margin-top:var(--s1);font-size:44px;font-weight:700;line-height:1.2;letter-spacing:-.5px}
.res .n small{font-size:22px;font-weight:600;margin-left:2px}
.res .cmp{margin-top:var(--s2);font-size:var(--fs-label);color:rgba(255,255,255,.64)}
/* 입력 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:var(--r-field);padding:4px;margin-bottom:var(--s4)}
.seg button{all:unset;text-align:center;height:40px;line-height:40px;border-radius:var(--r-small);font-size:var(--fs-label);font-weight:600;color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--seg-on,var(--card));color:var(--ink);font-weight:700}
.f+.f{margin-top:var(--s3)}
.f label{display:block;font-size:var(--fs-label);font-weight:600;color:var(--ink-2);margin-bottom:var(--s2)}
.box{display:flex;align-items:center;height:56px;padding:0 var(--s3);background:var(--card);border:1px solid var(--field-line);border-radius:var(--r-field)}
.box input{all:unset;flex:1;min-width:0;font-size:var(--fs-body);font-weight:600;color:var(--ink)}
.box span{color:var(--ink-3)}
.read{margin-top:6px;font-size:var(--fs-caption);color:var(--ink-3)}
/* 행 1종: 56px + chevron */
.row{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;min-height:56px;font-size:var(--fs-body);font-weight:600;color:var(--ink);cursor:pointer;list-style:none}
.row::-webkit-details-marker{display:none}
.row .v{display:flex;align-items:center;gap:var(--s1);font-size:var(--fs-body);font-weight:600;color:var(--ink)}
.row>span:first-child{font-size:var(--fs-label);font-weight:400;color:var(--ink-2)}
.row .chev{color:var(--ink-4)}
.chev{width:16px;height:16px;flex:0 0 auto;transition:transform .15s}
details[open]>.row .chev{transform:rotate(90deg)}
.in-last{margin-top:var(--s3);border-top:1px solid var(--line)}
.list{padding:0 var(--s4)}
.list>details+details{border-top:1px solid var(--line)}
.bl{padding:0 0 var(--s3)}
.bl div{display:flex;justify-content:space-between;min-height:36px;align-items:center;font-size:var(--fs-label)}
.bl div span:first-child{color:var(--ink-3)}
.bl div span:last-child{font-weight:600}
.bl .sum{border-top:1px solid var(--line);margin-top:var(--s1)}
.bl .sum span{color:var(--ink)!important;font-weight:700}
.howto{padding:0 0 var(--s3);font-size:var(--fs-label);color:var(--ink-2);line-height:1.6}
.src{padding:var(--s3) var(--s2) 0;font-size:var(--fs-caption);color:var(--ink-4)}
/* 조건 행: 결과 화면에서는 입력칸 대신 요약 행 */
.cond{padding:var(--s2) var(--s4)}
.cond .row+.row{border-top:1px solid var(--line)}
.row .k{font-weight:400;color:var(--ink-2);font-size:var(--fs-label)}
.cond .row .v{font-size:var(--fs-body);font-weight:600;color:var(--ink)}
.cond .row .chev{color:var(--ink-4)}
/* 행동 1: 흐름 안(고정 안 함) */
.cta{padding:var(--s2) 0 0}
.src{word-break:keep-all}
.cta a{display:flex;align-items:center;justify-content:center;gap:var(--s1);height:56px;max-width:480px;margin:0 auto;border-radius:var(--r-btn);background:var(--accent);color:#fff;text-decoration:none;font-size:var(--fs-body);font-weight:700}
.cta a:active{background:var(--accent-press)}
.cta .chev{width:18px;height:18px}
.foot{max-width:1080px;margin:var(--s5) auto 0;padding:var(--s4);display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;font-size:var(--fs-caption);color:var(--ink-4)}
@media (max-width:359px){.res{padding:var(--s3) var(--s4)}.res .n{font-size:36px}.cond{padding:var(--s1) var(--s3)}h1{padding-bottom:var(--s2)}}
@media (min-width:1024px){
  .res{order:0;padding:var(--s5)}
  .list details:first-child{} 
  body{padding-bottom:0}
  .menu{display:flex}
  h1{font-size:28px;padding:var(--s5) 0 var(--s4)}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"res in" "list cta";grid-template-rows:auto 1fr;column-gap:var(--s4);row-gap:var(--s3);align-items:start}
  .cond{grid-area:in}.list{grid-area:list}.res{grid-area:res}.cta{grid-area:cta}
  .cta{padding:0}
  .res .n{font-size:48px}
    .cta a{max-width:none}
  .wrap{padding:0 var(--s4)}
  .src{padding:var(--s4) 0 0}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="chev" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<header class="top"><img src="../../quality/ds-v2/icon-192.png" width="24" height="24" alt="" style="border-radius:6px"><b>파이어맵</b><nav class="menu"><a aria-current="page">연봉</a><a>퇴직금</a><a>실업급여</a></nav></header>
<main class="wrap">
  <h1>연봉 실수령액</h1>
  <div class="grid">
    <div class="col-l">
      <section class="card cond" aria-label="조건">
        <button class="row" type="button"><span class="k">연봉</span><span class="v num">4,000만 원<svg class="chev"><use href="#chev"/></svg></span></button>
        <button class="row" type="button"><span class="k">비과세액 (월)</span><span class="v num">20만 원<svg class="chev"><use href="#chev"/></svg></span></button>
        <button class="row" type="button"><span class="k">부양가족</span><span class="v num">1명 · 자녀 0명<svg class="chev"><use href="#chev"/></svg></span></button>
      </section>
      <section class="card list">
        <details>
          <summary class="row"><span>공제 6가지</span><span class="v num">−397,520원<svg class="chev"><use href="#chev"/></svg></span></summary>
          <div class="bl num">
            <div><span>국민연금</span><span>148,810원</span></div>
            <div><span>건강보험</span><span>112,640원</span></div>
            <div><span>장기요양</span><span>14,800원</span></div>
            <div><span>고용보험</span><span>28,190원</span></div>

        <details>
          <summary class="row"><span>계산 방법</span><span class="v"><svg class="chev"><use href="#chev"/></svg></span></summary>
          <p class="howto">연봉 ÷ 12에서 비과세액을 빼고 4대보험과 간이세액표 소득세를 뺍니다.</p>

      </section>
      <div class="cta"><a href="#">이 돈이면 몇 살에 은퇴?</a></div>
    </div>
    <div class="col-r">
      <section class="card res" aria-live="polite">
        <div class="q">한 달에 받는 돈</div>
        <div class="n num">2,935,813<small>원</small></div>
        <div class="cmp num">세전 월급의 88.1%</div>
      </section>
    </div>
  </div>
  <p class="src">참고용 · 2026. 2. 27. 개정 근로소득 간이세액표 · 국민연금 4.75% 등 2026년 요율</p>
</main>
<footer class="foot"><span>파이어맵</span><span>문의 · 개인정보처리방침 · 면책 안내</span></footer>
</body>
