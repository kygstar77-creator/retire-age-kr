<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>파이어맵 인사이트</title>
  <style>
    :root{--bg:#0f151c;--card:#161e27;--line:#26303c;--tx:#e7edf3;--mut:#8a97a6;--orange:#ff7a33;--green:#34d399}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5}
    main{max-width:920px;margin:0 auto;padding:22px 16px 80px}
    h1{font-size:22px;margin:0 0 2px}
    .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
    .row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
    .kpi{flex:1 1 150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
    .kpi small{color:var(--mut);font-size:12px;font-weight:600}
    .kpi b{display:block;font-size:26px;margin-top:4px;letter-spacing:-.02em}
    .kpi .on{color:var(--green)}
    section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
    h2{font-size:15px;margin:0 0 12px;color:#cdd7e1}
    .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
    .bar .lab{width:96px;flex:0 0 auto;color:var(--mut);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar .track{flex:1;background:#0e141b;border-radius:8px;overflow:hidden;height:18px}
    .bar .fill{height:100%;background:linear-gradient(90deg,#ff7a33,#ff5a00);border-radius:8px}
    .bar .val{width:46px;flex:0 0 auto;text-align:right;font-weight:700}
    .funnel{display:flex;flex-wrap:wrap;gap:8px}
    .step{flex:1 1 110px;background:#0e141b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
    .step small{display:block;color:var(--mut);font-size:11px}
    .step b{font-size:20px}
    .step em{font-style:normal;color:var(--green);font-size:12px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    button{background:#23303d;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
    .gate{padding:60px 20px;text-align:center;color:var(--mut)}
    .muted{color:var(--mut);font-size:12px}
  </style>
</head>
<body>
<main id="app"><p class="gate">불러오는 중…</p></main>
<script>
  var SB = ['https://cvhskxdwqubmshdgkzhj','supabase','co'].join('.');
  var KEY = ['sb','publishable','uhbAVqCA8JrJNXqaAcft9g','yYtwgct9'].join('_');
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function n(v){ return (Number(v)||0).toLocaleString(); }

  function bars(items, labelKey, valKey){
    if(!items || !items.length) return '<p class="muted">아직 데이터가 없어요</p>';
    var max = Math.max.apply(null, items.map(function(x){return Number(x[valKey])||0;})) || 1;
    return items.map(function(x){
      var v = Number(x[valKey])||0; var w = Math.max(3, Math.round(v/max*100));
      return '<div class="bar"><span class="lab">'+esc(x[labelKey])+'</span><span class="track"><span class="fill" style="width:'+w+'%"></span></span><span class="val">'+n(v)+'</span></div>';
    }).join('');
  }

  function evMap(events){ var m={}; (events||[]).forEach(function(e){ m[e.event]=Number(e.n)||0; }); return m; }

  function render(d){
    var t = d.today||{}, tot = d.totals||{};
    var ev = evMap(d.top_events);
    var funnel = [
      ['세션 시작','session_start'],
      ['계산 시작','start_calc'],
      ['계산 완료','calc_complete'],
      ['결과 조회','result_view'],
      ['저축 기록','save_log'],
      ['공유','share']
    ];
    var base = ev['session_start']||0;
    var funnelHtml = funnel.map(function(f){
      var v = ev[f[1]]||0; var pct = base? Math.round(v/base*100):0;
      return '<div class="step"><small>'+f[0]+'</small><b>'+n(v)+'</b><em>'+(base?pct+'%':'')+'</em></div>';
    }).join('');

    app.innerHTML =
      '<div class="topbar"><div><h1>파이어맵 인사이트</h1><p class="sub">실시간 익명 이용 집계 · '+esc((d.generated_at||'').slice(0,19).replace('T',' '))+' UTC</p></div><button onclick="load()">새로고침</button></div>'
      + '<div class="row">'
        + '<div class="kpi"><small>지금 접속</small><b class="on">'+n(t.online_now)+'명</b></div>'
        + '<div class="kpi"><small>오늘 세션</small><b>'+n(t.sessions)+'</b></div>'
        + '<div class="kpi"><small>오늘 활성 기기</small><b>'+n(t.active_clients)+'</b></div>'
        + '<div class="kpi"><small>오늘 화면조회</small><b>'+n(t.screen_views)+'</b></div>'
      + '</div>'
      + '<div class="row">'
        + '<div class="kpi"><small>누적 계산</small><b>'+n(tot.calc_users)+'명</b></div>'
        + '<div class="kpi"><small>누적 이벤트</small><b>'+n(tot.events)+'</b></div>'
        + '<div class="kpi"><small>커뮤니티 글</small><b>'+n(tot.community_posts)+'</b></div>'
        + '<div class="kpi"><small>계정</small><b>'+n(tot.accounts)+'</b></div>'
      + '</div>'
      + '<section><h2>오늘의 퍼널 (세션 대비 %)</h2><div class="funnel">'+funnelHtml+'</div></section>'
      + '<section><h2>화면별 조회 · 최근 24시간</h2>'+bars(d.top_screens,'screen','n')+'</section>'
      + '<section><h2>이벤트별 · 최근 24시간</h2>'+bars(d.top_events,'event','n')+'</section>'
      + '<p class="muted">개인정보·금액 원본은 수집·표시하지 않으며, 모든 수치는 익명 집계입니다.</p>';
  }

  function load(){
    fetch(SB+'/rest/v1/rpc/fm_insights', { method:'POST', headers:{ apikey:KEY, authorization:'Bearer '+KEY, 'content-type':'application/json' }, body:'{}' })
      .then(function(r){ return r.json(); })
      .then(function(d){ render(d); })
      .catch(function(){ app.innerHTML = '<p class="gate">불러오기에 실패했어요. 잠시 후 새로고침해 주세요.</p>'; });
  }

  if(params.get('k') !== 'fire'){
    app.innerHTML = '<p class="gate">접근 키가 필요합니다.<br>주소 뒤에 <b>?k=fire</b> 를 붙여 주세요.</p>';
  } else {
    load();
    setInterval(load, 30000);
  }
</script>
</body>
</html>
