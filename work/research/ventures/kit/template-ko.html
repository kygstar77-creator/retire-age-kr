<!doctype html>
<!-- 신사업 빈 템플릿(한국어) — firemap-venture-builder 2026-10-01
     쓰는 법: 이 파일을 public/<경로>/index.html 로 복사 → {{…}} 전부 채우기 → compute()만 구현.
     규칙: 본문은 JS 없이 첫 HTML에 있다(체크리스트 16). 숨김 텍스트 없음. 금융상품 권유 문구 금지(금소법·자본시장법).
     쿠팡 링크를 넣으면 링크 바로 위에 대가성 문구(coupang-policy.md 원문 그대로). 문구는 공식기관·실서비스에서 확인된 말만. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<!-- 영어판이 있으면: <link rel="alternate" hreflang="en" href="{{EN_URL}}"> <link rel="alternate" hreflang="ko" href="{{CANONICAL_URL}}"> -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f6f7f9">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"{{NAME}}","url":"{{CANONICAL_URL}}","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"KRW"}}</script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#18191d;--sub:#6b6e76;--line:#e5e6ea;--accent:#ff5a00;--dark:#18191d;--dark-ink:#f2f3f5;
  --fs1:30px;--fs3:22px;--fs4:20px;--fs5:17px;--fs6:15px;--fs7:13px}
@media (prefers-color-scheme:dark){:root{--bg:#101114;--card:#1b1c21;--ink:#f2f3f5;--sub:#9a9da5;--line:#2c2d34;--dark:#26272e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs5)/1.5 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;height:56px}
header a{color:var(--ink);text-decoration:none;font-weight:700}
h1{font-size:var(--fs1);line-height:1.33;margin:16px 0 8px}
.lead{color:var(--sub);margin:0 0 24px}
.card{background:var(--card);border-radius:20px;padding:24px 20px;margin:0 0 16px}
label{display:block;font-size:var(--fs6);color:var(--sub);margin:0 0 8px}
.field{margin:0 0 16px}
input,select{width:100%;height:48px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:var(--fs5);background:var(--card);color:var(--ink)}
button{height:56px;width:100%;border:0;border-radius:14px;font-size:var(--fs5);font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.ghost{background:rgba(127,127,127,.14);color:inherit;height:48px}
.result{background:var(--dark);color:var(--dark-ink);border-radius:20px;padding:24px 20px;margin:0 0 16px}
.result .k{font-size:var(--fs6);opacity:.75;margin:0}
.result .big{font-size:40px;font-weight:700;line-height:1.33;margin:4px 0 8px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.result .s{font-size:var(--fs6);opacity:.85;margin:0 0 16px}
h2{font-size:var(--fs4);margin:32px 0 12px}
.src{font-size:var(--fs7);color:var(--sub)}
footer{font-size:var(--fs7);color:var(--sub);margin-top:40px}
footer a{color:var(--sub)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="{{HOME_URL}}">{{BRAND}}</a></header>
  <main>
    <h1>{{H1}}</h1>
    <p class="lead">{{LEAD_ONE_LINE}}</p>

    <form id="f" class="card" novalidate>
      <div class="field"><label for="a">{{INPUT_A_LABEL}}</label><input id="a" name="a" inputmode="numeric" autocomplete="off" required></div>
      <button class="primary" type="submit">{{CTA}}</button>
    </form>

    <div id="r" class="result" hidden aria-live="polite">
      <p class="k">{{RESULT_LABEL}}</p>
      <p class="big" id="big">—</p>
      <p class="s" id="sub"></p>
      <button class="ghost" id="share" type="button">결과 공유하기</button>
    </div>

    <section>
      <h2>계산 방법</h2>
      <p>{{METHOD_PLAIN}}</p>
      <p class="src">근거: {{OFFICIAL_SOURCE_NAME_AND_URL}} · {{AS_OF_DATE}} 기준</p>
    </section>

    <section>
      <h2>자주 묻는 질문</h2>
      <h3>{{Q1}}</h3><p>{{A1}}</p>
    </section>
  </main>
  <footer>
    <p>입력값으로 기계적으로 계산한 참고용 추정치이며 세무·법률·투자 자문이 아닙니다. 입력한 숫자는 서버로 보내지 않습니다.</p>
    <p><a href="{{PRIVACY_URL}}">개인정보처리방침</a> · <a href="{{CONTACT_URL}}">문의</a></p>
  </footer>
</div>
<script src="/kit/fmkit.js"></script>
<script>
FMKit.init({ site: '{{SITE_ID}}', lang: 'ko' });
var fmt = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 0 });
function compute(v) {
  var a = Number(String(v.a || '').replace(/[^0-9.]/g, ''));
  if (!(a > 0)) return null;
  return { big: fmt.format(a) + '원', sub: '{{SUB_TEMPLATE}}', bucket: a < 30000000 ? '<3천' : a < 60000000 ? '3-6천' : '6천+' };
}
var last = null;
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var out = compute({ a: document.getElementById('a').value });
  if (!out) { FMKit.log('calc_invalid'); return; }
  last = out;
  document.getElementById('big').textContent = out.big;
  document.getElementById('sub').textContent = out.sub;
  document.getElementById('r').hidden = false;
  FMKit.log('calc_submit', { bucket: out.bucket });
});
document.getElementById('share').addEventListener('click', function () {
  if (!last) return;
  FMKit.share({ title: '{{H1}}', big: last.big, sub: last.sub, brand: '{{BRAND}}', text: '{{SHARE_TEXT}}' });
});
</script>
</body>
</html>
